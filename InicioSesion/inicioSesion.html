<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión</title>
  <link rel="stylesheet" href="../InicioSesion/style.css?v=20261106g">
</head>
<body>

<div class="contenedor contenedor-login">
  <!-- Banner Institucional -->
  <div class="encabezado encabezado-login">
    <img src="../img/cgzs.png" alt="CGZS" class="logo logo-izquierdo">
    <img src="../img/Elfuturo.png" alt="El Futuro es Hoy" class="logo logo-derecho">
    <h1>Coordinación General de la Zona Sur</h1>
  </div>

  <form id="formInicioSesion" class="formulario-login" action="../php/validar.php" method="POST" novalidate>
    <div class="titulo-seccion">
      <span>Inicio de sesión</span>
    </div>

    <!-- Mensaje de Alerta / Validación Error -->
    <div id="avisoLogin" class="caja-aviso" style="display: none;">Correo o contraseña incorrectos.</div>

    <div class="grupo-campo">
      <label for="correoLogin">Correo Electrónico <span class="obligatorio">*</span></label>
      <input type="email" id="correoLogin" name="correo" placeholder="correo@uagro.mx" required>
    </div>

    <div class="grupo-campo">
      <label for="contrasenaLogin">Contraseña <span class="obligatorio">*</span></label>
      <input type="password" id="contrasenaLogin" name="password" placeholder="••••••••" required>
      <a href="#" class="enlace-olvide-contrasena">Olvidé mi contraseña</a>
    </div>

    <div class="barra-botones-login">
      <button type="submit" class="boton boton-guardar">Iniciar Sesión</button>
    </div>
  </form>
</div>

<script src="../InicioSesion/app.js?v=20261106g"></script>
</body>
</html>
