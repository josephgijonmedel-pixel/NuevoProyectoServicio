  <form id="formUnidadResponsable" class="formulario-unidad" novalidate>
    <div class="titulo-seccion">
      <span>Datos Generales y de Contacto</span>
    </div>

    <!-- Mensaje de Alerta / Validación Error -->
    <div id="cajaAvisos" class="caja-aviso" style="display: none;"></div>
    <div id="cajaExito" class="caja-aviso aviso-exito" style="display: none;"></div>

    <div class="rejilla-unidad">
      <div class="grupo-campo ancho-completo">
        <label for="urNombreUnidad">Nombre de la Unidad Responsable <span class="obligatorio">*</span></label>
        <input type="text" id="urNombreUnidad" name="urNombreUnidad" maxlength="150" disabled required>
      </div>

      <div class="grupo-campo">
        <label for="urTipo">Tipo de Unidad Responsable <span class="obligatorio">*</span></label>
        <select id="urTipo" name="urTipo" disabled required>
          <option value="">Seleccione un tipo</option>
        </select>
      </div>

      <div class="grupo-campo">
        <label for="urNombreResp">Nombre del Responsable <span class="obligatorio">*</span></label>
        <input type="text" id="urNombreResp" name="urNombreResp" maxlength="150" disabled required>
      </div>

      <div class="grupo-campo">
        <label for="urCargo">Cargo del Responsable <span class="obligatorio">*</span></label>
        <select id="urCargo" name="urCargo" disabled required>
          <option value="">Seleccione un cargo</option>
        </select>
      </div>

      <div class="grupo-campo">
        <label for="urTel">Celular <span class="obligatorio">*</span></label>
        <input type="tel" id="urTel" name="urTel" maxlength="10" inputmode="numeric" placeholder="10 dígitos" disabled required>
      </div>

      <div class="grupo-campo ancho-completo">
        <label for="urCorreoInst">Correo Electrónico Institucional <span class="obligatorio">*</span></label>
        <input type="email" id="urCorreoInst" name="urCorreoInst" maxlength="150" disabled required>
      </div>

      <div class="grupo-campo ancho-completo">
        <label for="urCorreoPers">Correo Electrónico Personal <span class="obligatorio">*</span></label>
        <input type="email" id="urCorreoPers" name="urCorreoPers" maxlength="150" disabled required>
      </div>
    </div>

    <div class="barra-botones-unidad">
      <a href="../Programacion/programacion.html" class="boton boton-secundario">← Volver a Programación</a>
      
      <!-- Botón dinámico (intercambia entre Editar y Guardar) -->
      <button type="button" id="btnEditarUnidad" class="boton boton-editar">Editar mi Unidad</button>
    </div>
  </form>
</div>

<!-- MODAL CONFIRMAR GUARDAR -->
<div class="ventana-fondo" id="ventanaConfirmar">
  <div class="ventana-contenido ventana-confirmar-contenido">
    <div class="ventana-encabezado ventana-confirmar-encabezado">
      <h3 id="ventanaTitulo">Confirmación</h3>
      <button type="button" class="boton-cerrar-ventana" id="btnCerrarVentana">✕</button>
    </div>
    <div class="ventana-cuerpo ventana-confirmar-cuerpo">
      <div class="ventana-icono" id="ventanaIcono"></div>
      <p class="ventana-texto" id="ventanaTexto">¿Estás seguro que desea guardar?</p>
    </div>
    <div class="ventana-pie ventana-confirmar-pie" id="ventanaBotones">
      <button type="button" class="boton boton-cancelar" id="btnConfirmarNo">No</button>
      <button type="button" class="boton boton-confirmar" id="btnConfirmarSi">Sí</button>
    </div>
  </div>
</div>
